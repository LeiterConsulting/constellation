[restmap:create_dashboard]
description = Creates a private Studio dashboard and Constellation draft from a bounded dashboard pilot brief.
endpoint_name = constellation_mcp_create
method = post
tags = dashboard, constellation, pilot

[restmap:get_creation_status]
description = Retrieves the status and verified links of a dashboard pilot request owned by the current author.
endpoint_name = constellation_mcp_status
method = get
tags = dashboard, constellation, pilot

[restmap:inspect_dashboard_source]
description = Inspects sample field coverage for a selected Splunk source as the current caller.
endpoint_name = constellation_mcp_inspect
method = post
tags = dashboard, constellation, pilot, data
