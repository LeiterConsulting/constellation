[script:constellation_provider]
match = /constellation/v1
script = constellation_handler.py
scripttype = persist
handler = constellation_handler.ConstellationHandler
python.version = python3.9
python.required = 3.9,3.13
requireAuthentication = true
capability = search
output_modes = json
passSession = true
passSystemAuth = false
passPayload = true
passHttpHeaders = false
passHttpCookies = false

# Only the dedicated AITK and owner-only OpenAI handlers receive system auth.
[script:constellation_aitk]
match = /constellation/aitk
script = aitk_inference_handler.py
scripttype = persist
handler = aitk_inference_handler.AitkInferenceHandler
driver.env.CONSTELLATION_AITK_INFERENCE = 1
python.version = python3.9
python.required = 3.9,3.13
requireAuthentication = true
capability = search and constellation_use_aitk
output_modes = json
passSession = true
passSystemAuth = true
passPayload = true
passHttpHeaders = false
passHttpCookies = false

# Per-user key custody: never returns keys or accepts an owner/credential path.
[script:constellation_openai]
match = /constellation/openai
script = openai_private_handler.py
scripttype = persist
handler = openai_private_handler.OpenAIPrivateHandler
driver.env.CONSTELLATION_OPENAI_PRIVATE = 1
python.version = python3.9
python.required = 3.9,3.13
requireAuthentication = true
capability = search
output_modes = json
passSession = true
passSystemAuth = true
passPayload = true
passHttpHeaders = false
passHttpCookies = false

# Distinct driver configuration keeps short control calls responsive during inference.
[script:constellation_control]
match = /constellation/control
script = constellation_handler.py
scripttype = persist
handler = constellation_handler.ConstellationHandler
driver.env.CONSTELLATION_CONTROL = 1
python.version = python3.9
python.required = 3.9,3.13
requireAuthentication = true
capability = search
output_modes = json
passSession = true
passSystemAuth = false
passPayload = true
passHttpHeaders = false
passHttpCookies = false
